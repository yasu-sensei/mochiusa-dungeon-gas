name: Build standalone game
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile build_gas.py
      - run: python3 build_gas.py
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-game
          path: dist/index.html
          if-no-files-found: error
      - name: Save standalone release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update standalone game release"
            git push origin HEAD:main
          fi
